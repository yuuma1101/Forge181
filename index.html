<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forge 181">
<link rel="manifest" href="manifest.webmanifest">
<title>Forge 181</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--accent2:#dbeafe;}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans",sans-serif}
main{max-width:760px;margin:auto;padding:18px 16px 90px}
header{display:flex;justify-content:space-between;align-items:center;margin:8px 0 18px}
h1{font-size:28px;margin:0} h2{font-size:20px;margin:0 0 12px} .muted{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 6px 20px rgba(17,24,39,.05)}
.hero{background:linear-gradient(135deg,#111827,#1f3b73);color:white;border:0}
.hero .muted{color:#d1d5db}
.progress{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:10px 0}
.bar{height:100%;background:var(--accent);width:0%;transition:.3s}
.hero .bar{background:#93c5fd}
.task{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:start;padding:13px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.time{font-weight:700;color:var(--accent)} .task p{margin:4px 0 0;line-height:1.55}
button{border:0;border-radius:13px;padding:10px 14px;background:var(--accent);color:white;font-weight:700;font-size:14px}
button.secondary{background:#eef2ff;color:#1e3a8a}
button.done{background:#16a34a}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:5}
.nav button{background:transparent;color:var(--muted)} .nav button.active{color:var(--accent)}
.hidden{display:none} .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{padding:14px;border:1px solid var(--line);border-radius:16px;background:#fafafa}
.stat b{font-size:22px;display:block}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:16px;margin:8px 0 12px}
.badge{display:inline-block;background:var(--accent2);color:#1d4ed8;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}
.small{font-size:12px}

.lesson-block{padding:14px 0;border-bottom:1px solid var(--line)}
.lesson-block:last-child{border-bottom:0}
.lesson-block h3{margin:0 0 7px;font-size:17px}
.lesson-block p{margin:0;line-height:1.7}
.quiz-option{display:block;width:100%;text-align:left;margin:8px 0;background:#f3f4f6;color:var(--text);border:1px solid var(--line)}
.quiz-option.correct{background:#dcfce7;color:#166534;border-color:#86efac}
.quiz-option.wrong{background:#fee2e2;color:#991b1b;border-color:#fca5a5}
.answer-box{margin-top:12px;padding:13px;border-radius:14px;background:#eff6ff;line-height:1.65}
.study-start{width:100%;font-size:16px;padding:14px}
textarea{width:100%;min-height:90px;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:16px;font-family:inherit}
</style>
</head>
<body>
<main>
<section id="home">
<header><div><div class="muted">設計者を鍛える毎日20分</div><h1>Forge 181 ⚙️</h1></div><span id="streak" class="badge">🔥 0日</span></header>
<div class="card hero">
  <div class="muted">TODAY'S MISSION</div>
  <h2 id="todayTitle">読み込み中…</h2>
  <div id="todayDate" class="muted"></div>
  <div class="progress"><div id="todayBar" class="bar"></div></div>
  <div id="todayTasks"></div>
</div>
<div class="grid">
  <div class="stat"><span class="muted">半年の進捗</span><b id="overall">0%</b></div>
  <div class="stat"><span class="muted">完了日数</span><b id="completed">0 / 181</b></div>
</div>
<div class="card"><button class="study-start" onclick="show('study')">📚 アプリ内で今日の勉強を始める</button></div>
<div class="card"><h2>🎯 今月のテーマ</h2><div id="monthTheme"></div></div>
<div class="card"><h2>💡 今日のひとこと</h2><p id="note"></p></div>
</section>


<section id="study" class="hidden">
<header><div><div class="muted">LEARN IN APP</div><h1>今日の授業 📚</h1></div></header>
<div class="card hero">
  <div class="muted">20 MIN LESSON</div>
  <h2 id="lessonTitle">今日のテーマ</h2>
  <p id="lessonLead"></p>
</div>
<div class="card"><h2>① まず理解する</h2><div id="lessonBody"></div></div>
<div class="card"><h2>② ミニ問題</h2><div id="quizBox"></div></div>
<div class="card"><h2>③ 自分の言葉で説明</h2>
  <p class="muted">1〜2文でOK。書いた内容はこの端末に保存されます。</p>
  <textarea id="studyMemo" placeholder="今日わかったことを書く…"></textarea>
  <button class="study-start" onclick="saveMemo()">メモを保存</button>
</div>
<div class="card"><h2>④ 今日の学習を完了</h2>
  <p id="studyStatus">授業と問題が終わったら押そう。</p>
  <button id="finishStudy" class="study-start" onclick="finishLesson()">今日の20分を完了 ✓</button>
</div>
</section>

<section id="calendar" class="hidden">
<header><div><div class="muted">181 DAYS</div><h1>学習記録</h1></div></header>
<div class="card"><div id="calendarGrid"></div></div>
</section>

<section id="cards" class="hidden">
<header><div><div class="muted">REFERENCE</div><h1>設計者辞典</h1></div></header>
<div class="card"><input id="search" placeholder="例：公差 / SS400 / 軸受"><div id="cardList"></div></div>
</section>
</main>
<nav class="nav">
<button id="nHome" class="active" onclick="show('home')">🏠 今日</button>
<button id="nStudy" onclick="show('study')">📚 学ぶ</button>
<button id="nCal" onclick="show('calendar')">📅 記録</button>
<button id="nCards" onclick="show('cards')">📖 辞典</button>
</nav>

const STORAGE='forge181_v1';
let state=JSON.parse(localStorage.getItem(STORAGE)||'{"done":{},"memo":{},"quiz":{}}');
state.memo=state.memo||{}; state.quiz=state.quiz||{};
function save(){localStorage.setItem(STORAGE,JSON.stringify(state));}
function todayIndex(){
 const now=new Date(); const base=new Date('2026-09-01T00:00:00'); const end=new Date('2027-02-28T23:59:59');
 let x=new Date(now.getFullYear(),now.getMonth(),now.getDate()); 
 if(x<base) return 0; if(x>end) return DATA.days.length-1;
 return Math.floor((x-base)/86400000);
}
function render(){
 const i=todayIndex(), d=DATA.days[i], done=state.done[d.date]||0;
 document.getElementById('todayTitle').textContent=d.theme+' / '+d.subtopic;
 document.getElementById('todayDate').textContent=d.date.replaceAll('-',' / ')+'  Day '+d.day;
 document.getElementById('todayBar').style.width=(done/d.tasks.length*100)+'%';
 document.getElementById('todayTasks').innerHTML=d.tasks.map((t,j)=>`<div class="task"><div class="time">${t.time}分</div><div><b>${t.title}</b><p>${t.text}</p></div><button class="${j<done?'done':''}" onclick="complete(${j})">${j<done?'✓':'完了'}</button></div>`).join('');
 const completed=Object.values(state.done).filter(x=>x===d.tasks.length).length;
 document.getElementById('completed').textContent=completed+' / 181';
 document.getElementById('overall').textContent=Math.round(completed/DATA.days.length*100)+'%';
 const month=DATA.days[i].date.slice(5,7);
 const themes={'09':'図面読解','10':'CAD・3D設計','11':'材料・加工','12':'機械要素','01':'強度・設計計算','02':'実践設計'};
 document.getElementById('monthTheme').textContent=themes[month]||'半年間の総復習';
 document.getElementById('note').textContent=d.note;
 renderCalendar(); renderCards();
 // streak
 let s=0; for(let k=i;k>=0;k--){ if(state.done[DATA.days[k].date]===DATA.days[k].tasks.length)s++; else break; }
 document.getElementById('streak').textContent='🔥 '+s+'日';
}
function complete(j){
 const d=DATA.days[todayIndex()]; const cur=state.done[d.date]||0;
 if(j===cur) state.done[d.date]=Math.min(cur+1,d.tasks.length);
 else if(j<cur) state.done[d.date]=j;
 save(); render();
}
function renderCalendar(){
 const wrap=document.getElementById('calendarGrid');
 wrap.innerHTML=DATA.days.map(d=>{const c=state.done[d.date]===d.tasks.length?'done':''; return `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span>${d.day}　${d.date}　${d.theme}</span><b class="${c?'':'muted'}">${c?'✓':'—'}</b></div>`}).join('');
}
function renderCards(){
 const q=(document.getElementById('search').value||'').toLowerCase();
 document.getElementById('cardList').innerHTML=DATA.cards.filter(x=>(x[0]+x[1]).toLowerCase().includes(q)).map(x=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><b>${x[0]}</b><p class="small">${x[1]}</p></div>`).join('');
}

 explain:"設計知識は、意味だけでなく目的と実務での使いどころまでつなげると使える知識になる。"};
}
function renderStudy(){
 const d=DATA.days[todayIndex()], L=LESSONS[d.subtopic]||fallbackLesson(d);
 document.getElementById('lessonTitle').textContent='Day '+d.day+'｜'+d.subtopic;
 document.getElementById('lessonLead').textContent=L.lead;
 document.getElementById('lessonBody').innerHTML=L.points.map((p,i)=>`<div class="lesson-block"><h3>${i+1}. ${p[0]}</h3><p>${p[1]}</p></div>`).join('');
 const answered=state.quiz[d.date];
 document.getElementById('quizBox').innerHTML=`<p><b>${L.q}</b></p>`+
 L.options.map((o,i)=>`<button class="quiz-option ${answered!==undefined?(i===L.answer?'correct':(i===answered?'wrong':'')):''}" onclick="answerQuiz(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')+
 (answered!==undefined?`<div class="answer-box"><b>${answered===L.answer?'正解！ 🎉':'もう一歩！'}</b><br>${L.explain}</div>`:'');
 document.getElementById('studyMemo').value=state.memo[d.date]||'';
 const finished=state.done[d.date]===d.tasks.length;
 document.getElementById('studyStatus').textContent=finished?'今日の学習は完了済み！🔥':'授業→問題→メモまで進めたら完了にしよう。';
 document.getElementById('finishStudy').classList.toggle('done',finished);
 document.getElementById('finishStudy').textContent=finished?'✓ 今日の学習 完了':'今日の20分を完了 ✓';
}
function answerQuiz(i){
 const d=DATA.days[todayIndex()]; state.quiz[d.date]=i; save(); renderStudy();
}
function saveMemo(){
 const d=DATA.days[todayIndex()]; state.memo[d.date]=document.getElementById('studyMemo').value.trim(); save();
 const b=document.querySelector('#study button.study-start'); 
 alert('メモを保存したよ！');
}
function finishLesson(){
 const d=DATA.days[todayIndex()];
 state.done[d.date]=d.tasks.length; save(); render(); renderStudy();
}

function show(id){
 ['home','study','calendar','cards'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));
 [['nHome','home'],['nStudy','study'],['nCal','calendar'],['nCards','cards']].forEach(([b,x])=>document.getElementById(b).classList.toggle('active',x===id));
}
document.getElementById('search').addEventListener('input',renderCards);
render(); renderStudy();
</script>
